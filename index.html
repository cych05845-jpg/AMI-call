<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{
    --red:#D92B2B;--red-dark:#A81E1E;--red-light:#FF4444;--orange:#E8720C;--yellow:#F5A623;
    --green:#1A9E5C;--green-light:#22C76E;--blue:#1A6BB5;--blue-light:#2E87D4;--purple:#7C3AED;
    --bg:#0A0C10;--bg2:#111318;--bg3:#181B22;--bg4:#1E222C;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;
    background:radial-gradient(1100px 600px at 0% -10%,rgba(34,211,238,.09),transparent 60%),radial-gradient(900px 520px at 110% 0%,rgba(124,58,237,.11),transparent 60%),var(--bg);background-attachment:fixed}
  :root{--cyan:#22D3EE;--cyan2:rgba(34,211,238,.16)}
  .mono{font-family:'JetBrains Mono',monospace}.hidden{display:none!important}
  /* LOGIN */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 30% 20%,rgba(217,43,43,.12),transparent 60%),var(--bg)}
  .login-card{width:100%;max-width:380px;background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:32px 24px;box-shadow:var(--shadow)}
  .logo{text-align:center;margin-bottom:22px}
  .logo .ic{width:54px;height:54px;background:linear-gradient(135deg,var(--red),var(--red-dark));border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:8px}
  .logo h1{font-size:1.2rem;font-weight:900}.logo p{font-size:.75rem;color:var(--text3);margin-top:3px}
  .fg{margin-bottom:12px}.fg label{display:block;font-size:.74rem;font-weight:600;color:var(--text2);margin-bottom:5px}

  /* NAV */

  .nav-row{height:54px;display:flex;align-items:center;padding:0 14px;gap:10px;max-width:1100px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .nav-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--red),var(--red-dark));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
  .nav-title{font-size:.92rem;font-weight:700;white-space:nowrap}.nav-sub{font-size:.66rem;color:var(--text3)}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;font-size:.78rem;cursor:pointer;color:var(--text2);white-space:nowrap}
  .bot-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,12,16,.97);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:100}
  .ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;border:none;background:transparent;font-family:inherit;color:var(--text3)}
  .ni.on{color:var(--red-light)}.ni .i{font-size:1.4rem}.ni .l{font-size:.72rem;font-weight:700}
  /* LAYOUT */
  .page{display:none;padding-bottom:90px}.page.on{display:block}
  .content{max-width:760px;margin:0 auto;padding:14px}
  #pageEMT .content{max-width:1000px}
  .card{background:rgba(17,19,24,.74);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:18px;margin-bottom:12px}
  .card-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .card-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
  .card-title{font-size:.98rem;font-weight:700}.card-sub{font-size:.74rem;color:var(--text3);margin-top:2px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.g2{grid-template-columns:1fr}}
  /* BUTTON */

  .br{background:var(--red);color:#fff}.bg{background:var(--green);color:#fff}.bb{background:var(--blue);color:#fff}.bo{background:var(--orange);color:#fff}
  .bgh{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}
  .btn-lg{padding:15px 20px;font-size:1.05rem}.btn-fw{width:100%}.btn-sm{padding:6px 11px;font-size:.78rem}
  .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.act .btn{flex:1;min-width:130px}
  /* ALERT/TAG */
  .alert{padding:11px 14px;border-radius:var(--radius-sm);font-size:.86rem;line-height:1.55;display:flex;gap:9px;margin-bottom:12px}
  .al-red{background:rgba(217,43,43,.1);border:1px solid rgba(217,43,43,.3);color:#FF8080}
  .al-yellow{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);color:#FFD060}
  .al-green{background:rgba(26,158,92,.1);border:1px solid rgba(26,158,92,.3);color:var(--green-light)}
  .al-blue{background:rgba(26,107,181,.12);border:1px solid rgba(26,107,181,.35);color:#7DB8F0}
  .tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.74rem;font-weight:700;margin:0 4px 4px 0}
  .t-red{background:rgba(217,43,43,.18);color:#FF8080}.t-green{background:rgba(26,158,92,.18);color:var(--green-light)}
  .t-blue{background:rgba(26,107,181,.2);color:#7DB8F0}.t-yellow{background:rgba(245,166,35,.16);color:#FFD060}
  .t-purple{background:rgba(124,58,237,.2);color:#C4B5FD}.t-gray{background:var(--bg4);color:var(--text2)}
  /* EMT */
  .emt-head{text-align:center;padding:10px 0 6px}.emt-head h2{font-size:1.5rem;font-weight:900;color:var(--orange)}
  .emt-head p{font-size:.82rem;color:var(--text3);margin-top:6px}

  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(min-width:600px){.grid4{grid-template-columns:repeat(4,1fr)}}
  .sel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 8px;min-height:92px;background:rgba(26,158,92,.07);border:2px solid rgba(26,158,92,.32);border-radius:14px;cursor:pointer;color:var(--text);font-family:inherit;font-size:1.25rem;font-weight:900;line-height:1.3;touch-action:manipulation}
  .sel.small{min-height:64px;font-size:1.08rem}
  .sel.on{background:rgba(26,158,92,.25);border-color:var(--green);color:var(--green-light);box-shadow:0 0 0 3px rgba(26,158,92,.3)}
  .sel.blue{background:rgba(26,107,181,.08);border-color:rgba(26,107,181,.35)}
  .sel.blue.on{background:rgba(26,107,181,.28);border-color:var(--blue-light);color:#9CCBF5;box-shadow:0 0 0 3px rgba(26,107,181,.3)}
  @media(min-width:600px){.sel{font-size:1.55rem;min-height:118px}.sel.small{font-size:1.3rem;min-height:80px}}
  .ekg-up{width:100%;min-height:104px;border:2px dashed rgba(245,166,35,.55);background:rgba(245,166,35,.07);border-radius:14px;color:#FFD060;font-size:1.2rem;font-weight:900;cursor:pointer;font-family:inherit}
  .ekg-up.done{border-style:solid;border-color:var(--green);background:rgba(26,158,92,.12);color:var(--green-light)}
  .ekg-prev{width:100%;border-radius:10px;margin-top:10px;display:block}
  .cid{font-family:'JetBrains Mono',monospace;color:var(--yellow);font-weight:700}
  /* CASE */
  .case-li{padding:12px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:9px;cursor:pointer}
  .case-li.need{border-color:var(--red);box-shadow:0 0 0 2px rgba(217,43,43,.25)}
  .case-li .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.case-li .r2{font-size:.78rem;color:var(--text3);margin-top:5px}
  .kv{display:grid;grid-template-columns:92px 1fr;gap:7px 10px;font-size:.88rem}.kv dt{color:var(--text3)}
  .ekgs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
  .ekg-slot{background:#fff;border-radius:10px;min-height:80px;display:flex;align-items:center;justify-content:center;color:#888;font-size:.85rem;overflow:hidden;cursor:zoom-in}
  .ekg-slot img{width:100%;display:block}
  .calls{width:100%;border-collapse:collapse;font-size:.84rem}
  .calls td,.calls th{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left}.calls th{color:var(--text3);font-size:.72rem}
  .tl{position:relative;padding-left:18px}.tl:before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border2)}
  .tl-i{position:relative;margin-bottom:10px;font-size:.85rem;line-height:1.45}
  .tl-i:before{content:'';position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--bg4);border:2px solid var(--text3)}
  .tl-i.ok:before{border-color:var(--green-light);background:rgba(26,158,92,.4)}
  .tl-t{font-family:'JetBrains Mono',monospace;color:var(--text3);font-size:.76rem;margin-right:6px}.tl-w{color:var(--text3);font-size:.76rem}
  .mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:600px){.mgrid{grid-template-columns:repeat(3,1fr)}}
  .metric{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px}
  .metric .l{font-size:.74rem;color:var(--text3)}.metric .v{font-size:1.3rem;font-weight:900;margin-top:2px}
  .tabs{display:flex;gap:6px;margin-bottom:12px}.tab{flex:1;padding:9px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:inherit;font-weight:700;cursor:pointer}
  .tab.on{background:var(--bg4);color:var(--text);border-color:var(--border2)}
  .row-li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;margin-bottom:8px;font-size:.85rem}
  .row-li .grow{flex:1;min-width:140px}
  .chk{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--bg4);border:1px solid var(--border2);border-radius:9px;margin-bottom:8px;cursor:pointer;font-size:.9rem}
  .chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}
  /* MODAL/TOAST */
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:16px}
  .ov.on{display:flex}
  .mbox{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:22px 20px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
  .mbox h3{font-size:1.08rem;margin-bottom:10px}
  .mbox.wide{max-width:96vw;padding:10px}.zoom img{width:100%;display:block;border-radius:8px}
  #toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);padding:11px 20px;border-radius:24px;font-size:.86rem;z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
  #toast.show{opacity:1}#toast.ok{border-color:var(--green);color:var(--green-light)}#toast.err{border-color:var(--red);color:#FF8080}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .muted{color:var(--text3);font-size:.82rem}
  /* ── 科技感：任務管線 ── */
  .pipe{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none}.pipe::-webkit-scrollbar{display:none}
  .pn{flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;position:relative}
  .pn:not(:last-child)::after{content:'';position:absolute;top:16px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:rgba(255,255,255,.12)}
  .pn.done:not(:last-child)::after{background:linear-gradient(90deg,var(--green-light),var(--cyan));box-shadow:0 0 6px rgba(34,211,238,.5)}
  .pd{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.95rem;background:var(--bg4);border:2px solid rgba(255,255,255,.14);z-index:1}
  .pn.done .pd{background:rgba(34,199,110,.16);border-color:var(--green-light);box-shadow:0 0 12px rgba(34,199,110,.45)}
  .pn.now .pd{border-color:var(--cyan);background:var(--cyan2);animation:ping 1.6s infinite}
  .pn.warn .pd{border-color:#F5A623;background:rgba(245,166,35,.16);color:#FFD060;font-weight:900;box-shadow:0 0 12px rgba(245,166,35,.45)}.pn.warn .pl{color:#FFD060;font-weight:700}
  .mini i.warn{background:#F5A623}
  .pn.skip .pd{opacity:.3}.pn.skip .pl{text-decoration:line-through;opacity:.5}
  .pl{font-size:.68rem;color:var(--text3);margin-top:5px;white-space:nowrap}.pn.done .pl{color:var(--text2)}.pn.now .pl{color:var(--cyan);font-weight:800}
  .pt{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--text3);margin-top:1px}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}70%{box-shadow:0 0 0 11px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
  .mini{display:flex;gap:4px;margin-top:7px}.mini i{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
  .mini i.done{background:var(--green-light)}.mini i.now{background:var(--cyan);animation:blink 1s infinite}.mini i.skip{background:rgba(255,255,255,.05)}
  @keyframes blink{50%{opacity:.35}}
  /* ── 倒數環 ── */
  .ringwrap{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.25);margin-bottom:12px}
  .ringwrap.late{background:rgba(217,43,43,.08);border-color:rgba(255,68,68,.45)}
  .ring{width:58px;height:58px;flex-shrink:0;position:relative}.ring svg{transform:rotate(-90deg)}
  .ring .rt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700}
  .ring circle{fill:none;stroke-width:5}.ring .bgc{stroke:rgba(255,255,255,.1)}.ring .fg{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset .9s linear}
  .ringwrap.late .fg{stroke:var(--red-light)}.ringwrap.late .rt{color:#FF8080}
  /* ── EKG 掃描 ── */
  .ekg-slot{position:relative}
  .ekg-slot.scan::after{content:'';position:absolute;left:0;right:0;height:35%;top:-35%;background:linear-gradient(180deg,transparent,rgba(34,211,238,.38),transparent);animation:scan 1.5s linear infinite;pointer-events:none}
  .ekg-slot.scan::before{content:'AI SCANNING';position:absolute;top:8px;right:10px;font:700 .65rem 'JetBrains Mono',monospace;color:#0891B2;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:4px;z-index:2}
  @keyframes scan{to{top:100%}}
  /* ── AI 分析面板 ── */
  .aip{margin-top:10px;border-radius:14px;padding:14px;background:linear-gradient(160deg,rgba(34,211,238,.10),rgba(124,58,237,.12));border:1px solid rgba(34,211,238,.35);box-shadow:0 0 24px rgba(34,211,238,.08) inset}
  .aip-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

  .aip-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:blink 1.2s infinite}

  .ld.up{background:rgba(255,68,68,.18);border-color:rgba(255,68,68,.7);color:#FFB3B3;box-shadow:0 0 10px rgba(255,68,68,.35)}

  .legend{display:flex;gap:12px;font-size:.68rem;color:var(--text3);margin-top:6px}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .aip-find{font-size:.84rem;color:#E0F7FB;line-height:1.6;margin-top:10px;min-height:1.2em}
  .aip-sub{font-size:.78rem;color:var(--text2);margin-top:4px}
  .aip-disc{font-size:.68rem;color:var(--text3);margin-top:10px;border-top:1px dashed rgba(255,255,255,.12);padding-top:8px}
  .eq{display:flex;gap:3px;align-items:flex-end;height:22px}.eq i{width:4px;background:var(--cyan);border-radius:2px;animation:eq 1s infinite ease-in-out}

  @keyframes eq{0%,100%{height:5px}50%{height:22px}}
  .caret::after{content:'▍';color:var(--cyan);animation:blink .8s infinite}
  .case-li.need{border-color:var(--red);box-shadow:0 0 0 2px rgba(217,43,43,.25),0 0 18px rgba(217,43,43,.18)}

<body>

        <select class="inp" id="rgRole" onchange="regRoleChg()">
          <option value="emt">EMT</option><option value="np">急診專師</option><option value="dr">急診醫師</option>
          <option value="cv">CV 醫師</option><option value="tech">導管室技術員</option><option value="nurse">導管室護理師</option>

      <button class="btn bb btn-lg btn-fw" onclick="doRegister()">送出申請</button>
      <div class="link" onclick="showReg(false)">返回登入</div>

</div>

<!-- ═════════ APP ═════════ -->
<div id="app" class="hidden">
  <div class="top-nav"><div class="nav-row">

    <div class="chip theme-btn" onclick="themeCycle()" title="切換深色／淺色" aria-label="切換深色／淺色"><span class="themeIc"></span></div>

  </div></div>

  <!-- EMT -->
  <div class="page" id="pageEMT"><div class="content">

      <div class="emt-head"><h2>AMI 院前初篩</h2><p>點選即可，免打字｜🚑 <span id="emtUnit"></span></p></div>

      <img id="ekgPrev" class="ekg-prev hidden" alt="EKG 預覽">
      <div class="sec-t">④ 預計到院</div><div class="grid4" id="g_eta"></div>
      <div id="emtHint" class="alert al-yellow" style="margin-top:16px"><span>ℹ️</span><div>請完成：EKG、至少一項主要表現、預計到院時間</div></div>
      <button class="btn bo btn-lg btn-fw" id="emtSubmit" onclick="emtSubmit()" disabled style="font-size:1.3rem;padding:20px">確認送出通報</button>
    </div>

  <!-- 任務 -->

    <div id="taskDetail" class="hidden"></div>
  </div></div>

  <!-- 追蹤 -->

  <!-- 管理 -->

    <div class="tabs"><button class="tab on" id="tabAcc" onclick="adminTab('acc')">帳號</button><button class="tab" id="tabRos" onclick="adminTab('ros')">班表</button></div>

<script>
// ════════════════════════════════════════
//  設定（部署後只要改這一行）
// ════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbxXlgTK8lW8DUDvHXgjUetbvsi8_pnPS25czCFvXn3p8_zp9TyfqQCbjnQqaTMAj_MD/exec';
const VERSION = 'v1.7';
const POLL_MS = 5000;

const ROLES = {
  emt:{label:'EMT',icon:'🚑'}, np:{label:'急診專師',icon:'⚡'}, dr:{label:'急診醫師',icon:'🩺'},
  ern:{label:'急診護理師',icon:'🛏️'},
  cv:{label:'CV 醫師',icon:'❤️'}, tech:{label:'導管室技術員',icon:'🏥'}, nurse:{label:'導管室護理師',icon:'💉'},
  admin:{label:'管理者',icon:'⚙️'}
};
const NAV = {
  emt:[['pageEMT','🚑','通報']],
  admin:[['pageAdmin','⚙️','管理'],['pageTask','📋','任務'],['pageTrack','🗂','追蹤']],
  _:[['pageTask','📋','任務'],['pageTrack','🗂','追蹤']]
};
const SYM=[['chest','胸痛／胸悶'],['sweat','冒冷汗'],['sob','呼吸喘'],['shock','昏厥／休克徵象']];
const ONSET=[['lt3','< 3 小時'],['3to12','3–12 小時'],['gt12','> 12 小時／不明']];
const TX=[['o2','給氧'],['iv','建立 IV'],['med','已給藥（依救護規範）'],['mon','心電監視']];
const ETA=[['5','5 分'],['10','10 分'],['15','15 分'],['20','20 分以上']];
const STATUS={pending:['待 NP 判斷','t-yellow'],cv_reading:['CV 判讀中','t-purple'],activated:['已啟動導管室','t-red'],
  in_cath:['已進導管室','t-green'],closed:['NP 結案','t-gray'],not_activated:['CV 不啟動','t-gray']};
const CALLST={pending:'待撥',dialing:'撥號中',acked:'已確認',no_ack:'接了未按 1',no_answer:'未接',busy:'忙線',failed:'撥號失敗',canceled:'取消'};
const CALLROLE={np:'專師',cv:'CV',tech:'技術員',nurse:'護理師'};
const LBL=(arr,k)=>(arr.find(a=>a[0]===k)||[,k||'—'])[1];

let TOKEN=null, CU=null, cases=[], selId=null, page=null, pollTimer=null, seen=null, roster=null;
const ekgCache={};
let AI_OFF=false; const aiKicked=new Set();
const AIS={likely:['疑似 STEMI','t-red'],possible:['可能 STEMI','t-yellow'],unlikely:['不像 STEMI','t-green'],uncertain:['無法判定','t-gray']};
const emt={sym:new Set(), onset:null, eta:null, ekg:null, caseId:null, case:null};

// ════════════════════════════════════════
//  API（同 ECPR：小資料 GET、大資料 POST text/plain）
// ════════════════════════════════════════
async function api(action, data={}){
  const body = JSON.stringify(Object.assign({action, token:TOKEN}, data));
  try{
    const r = body.length<=1500 ? await fetch(API+'?payload='+encodeURIComponent(body))
      : await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j = await r.json();
    if(j && j.relogin && TOKEN){ toast('登入逾時，請重新登入','err'); logout(); }
    return j || {success:false,message:'沒有回應'};
  }catch(e){ return {success:false,message:'連線失敗：'+e.message}; }
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const THEMES=[['dark','🌙','深色'],['light','☀️','淺色'],['auto','🖥','跟隨系統']];
function themeApply(){ const pref=lsGet('ami_theme')||'dark';
  const t=pref==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):pref;
  document.documentElement.dataset.theme=t;
  const it=THEMES.find(x=>x[0]===pref)||THEMES[0];
  document.querySelectorAll('.themeIc').forEach(e=>{ e.textContent=it[1]; e.parentElement.title='目前：'+it[2]+'（點一下切換）'; }); }
function themeCycle(){ const pref=lsGet('ami_theme')||'dark'; const i=THEMES.findIndex(x=>x[0]===pref);
  const nx=THEMES[(i+1)%THEMES.length]; lsSet('ami_theme',nx[0]); themeApply(); toast('顯示：'+nx[2],'ok'); }
try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{ if((lsGet('ami_theme')||'dark')==='auto') themeApply(); }); }catch(e){}
function lsSet(k,v){ try{ v===null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }

// ════════════════════════════════════════
//  登入
// ════════════════════════════════════════
function showReg(on){ document.getElementById('loginForm').classList.toggle('hidden',on); document.getElementById('regForm').classList.toggle('hidden',!on); }
function showLocal(on){ document.getElementById('ssoBox').classList.toggle('hidden',on); document.getElementById('loginForm').classList.toggle('hidden',!on); document.getElementById('regForm').classList.add('hidden'); }
async function runDiag(){
  const box=document.getElementById('diagBox'); box.classList.remove('hidden');
  const L=[]; const add=(ok,t,d)=>{ L.push([ok,t,d||'']); paint(); };
  const paint=()=>{ box.innerHTML=`<div class="card" style="padding:12px 14px;text-align:left">${L.map(([ok,t,d])=>`<div style="font-size:.84rem;margin-bottom:6px">${ok===null?'⏳':(ok?'✅':'❌')} <b>${esc(t)}</b>${d?`<div class="muted" style="margin-left:22px;word-break:break-all">${esc(d)}</div>`:''}</div>`).join('')}
    <button class="btn bgh btn-sm" onclick="copyDiag()">📋 複製診斷結果</button></div>`; window._diagText=L.map(([ok,t,d])=>(ok?'OK ':'NG ')+t+(d?'：'+d:'')).join('\n'); };
  add(true,'AMI 前端版本',VERSION);
  const here=location.origin+location.pathname;
  add(/^https:\/\/cych05845-jpg\.github\.io\//.test(here),'網址',here+(/github\.io/.test(here)?'':'（必須從 https://cych05845-jpg.github.io/… 開啟，才能共用帳號中心登入）'));
  add(!!window.ACCOUNT,'帳號中心元件',window.ACCOUNT?'已載入':'account-sdk.js 沒有載入（網路或網址問題）');
  try{ const r=await fetch(API); const t=await r.text(); add(/AMI API OK/.test(t),'AMI 後端',/AMI API OK/.test(t)?'連線正常':t.slice(0,120)); }catch(e){ add(false,'AMI 後端','連不到：'+e.message); }
  if(!window.ACCOUNT){ return; }
  const ct=ACCOUNT.token(), cu=ACCOUNT.cachedUser();
  add(!!ct,'帳號中心登入狀態',ct?('已登入：'+(cu?(cu.empId+' '+(cu.name||'')):'')):'這個瀏覽器還沒登入帳號中心（請按上面紅色按鈕）');
  if(!ct) return;
  try{ const v=await ACCOUNT.verify(); add(!!v.ok,'帳號中心驗證',v.ok?('權限：'+((v.user&&v.user.perms)||[]).join(', ')+(v.user&&v.user.mustChange?'｜⚠ 尚未改 PIN':'')):(v.error||'失敗')); }catch(e){ add(false,'帳號中心驗證','連不到帳號中心：'+e.message); }
  const r=await api('ssoLogin',{centerToken:ct});
  add(!!r.success,'AMI 登入交換',r.success?('成功：'+r.user.displayname+'（'+(ROLES[r.user.role]||{}).label+'）'):(r.message||'失敗'));
  if(r.success){ TOKEN=r.token; CU=r.user; lsSet('ami_token',TOKEN); setTimeout(startApp,800); }
}
function copyDiag(){ try{ navigator.clipboard.writeText(window._diagText||''); toast('已複製，貼給 Claude 即可','ok'); }catch(e){ toast('請手動截圖','err'); } }
function ssoGo(){ if(!window.ACCOUNT){ toast('帳號中心元件載入失敗，請確認網路後重新整理','err'); return; } ACCOUNT.goLogin(); }
function ssoMsg(html,cls){ const e=document.getElementById('ssoMsg'); e.className='alert '+(cls||'al-yellow'); e.innerHTML=html; e.classList.toggle('hidden',!html); }
async function trySso(){
  if(!window.ACCOUNT) return false;
  const ct=ACCOUNT.token(); if(!ct) return false;
  ssoMsg('<span class="spin"></span>&nbsp;帳號中心登入中…','al-blue');
  const r=await api('ssoLogin',{centerToken:ct});
  if(r.success){ ssoMsg(''); TOKEN=r.token; CU=r.user; lsSet('ami_token',TOKEN); startApp(); return true; }
  const link=`<div style="margin-top:8px"><a class="btn bgh btn-sm" href="${ACCOUNT.centerUrl}">前往帳號中心</a></div>`;
  ssoMsg('<div>'+esc(r.message||'登入失敗')+((r.needPin||r.noPerm||r.needCenter)?link:'')+'</div>');
  return false;
}
function regRoleChg(){ document.getElementById('rgUnitWrap').classList.toggle('hidden', document.getElementById('rgRole').value!=='emt'); }
async function doLogin(){
  const b=document.getElementById('lgBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  const r=await api('login',{username:val('lgUser'),password:val('lgPass')});
  b.disabled=false; b.textContent='登入';
  if(!r.success){ toast(r.message,'err'); return; }
  TOKEN=r.token; CU=r.user; lsSet('ami_token',TOKEN); startApp();
}
async function doRegister(){
  const r=await api('register',{username:val('rgUser'),displayname:val('rgName'),password:val('rgPass'),
    role:val('rgRole'),unit:val('rgUnit'),phone:val('rgPhone')});
  toast(r.message||(r.success?'已送出':'失敗'), r.success?'ok':'err');
  if(r.success) showReg(false);
}
function logout(){
  if(CU && CU.sso && window.ACCOUNT){ try{ ACCOUNT.logout(); }catch(e){} }   // 帳號中心共用登入：一起登出
  TOKEN=null; CU=null; lsSet('ami_token',null); clearInterval(pollTimer); closeModal();
  document.getElementById('app').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden');
}
function startApp(){
  document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
  const R=ROLES[CU.role]||{};
  document.getElementById('meIcon').textContent=R.icon||''; document.getElementById('meName').textContent=CU.displayname;
  document.getElementById('navSub').textContent=R.label+(CU.unit?'｜'+CU.unit:'');
  const nav=NAV[CU.role]||NAV._;
  document.getElementById('botNav').innerHTML=nav.map(([p,i,l])=>`<button class="ni" data-p="${p}" onclick="go('${p}')"><span class="i">${i}</span><span class="l">${l}</span></button>`).join('');
  if(CU.role==='emt'){ buildEMT(); const saved=lsGet('ami_emt_case'); if(saved){ emt.caseId=saved; } }
  seen=null; go(nav[0][0]);
  clearInterval(pollTimer); pollTimer=setInterval(poll,POLL_MS);
}
function go(p){
  page=p; document.querySelectorAll('.page').forEach(x=>x.classList.remove('on')); document.getElementById(p).classList.add('on');
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.p===p));
  if(p==='pageTask'){ selId=null; renderTask(); loadRoster(); }
  if(p==='pageTrack') loadTrack();
  if(p==='pageAdmin') adminTab('acc');
  if(p==='pageEMT') renderEMT();
  poll(); window.scrollTo(0,0);
}
async function poll(){
  if(!TOKEN || document.hidden) return;
  if(page==='pageTask'){
    const r=await api('getCases',{scope:'active'});

}

function needsMe(c){
  const r=CU.role;
  if(r==='np') return c.status==='pending';
  if(r==='cv') return c.status==='cv_reading';
  if(r==='tech'||r==='nurse') return c.status==='activated' && !(c.cathBy||[]).some(x=>uk(x.username)===uk(CU.username));
  if(r==='dr') return c.status==='pending'||c.status==='cv_reading';
  if(r==='ern') return ['cv_reading','activated'].includes(c.status) && !c.arrivalTime;
  return false;
}
function checkNew(){
  const now=new Set(cases.filter(needsMe).map(c=>c.CaseID+'|'+c.status));
  if(seen){ const fresh=[...now].filter(k=>!seen.has(k)); if(fresh.length){ beep(); toast('有新任務：'+fresh[0].split('|')[0],'err'); try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){} } }
  seen=now;
}
let actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); [0,.35].forEach(d=>{ const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.25,actx.currentTime+d); o.start(actx.currentTime+d); o.stop(actx.currentTime+d+.22); }); }catch(e){} }

let pickMode=null;
function pickEkg(mode){ pickMode=mode; const f=document.getElementById('fileIn'); f.value=''; f.click(); }
document.getElementById('fileIn').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  let data; try{ data=await compressImage(file); }catch(err){ toast('圖片讀取失敗','err'); return; }
  if(pickMode==='emt'){
    emt.ekg=data; const p=document.getElementById('ekgPrev'); p.src=data; p.classList.remove('hidden');
    const b=document.getElementById('ekgBtn'); b.classList.add('done'); b.textContent='✅ EKG 已拍（點此重拍）'; emtCheck();
  } else {
    const caseId = pickMode==='more' ? emt.caseId : selId;
    toast('上傳中…');
    const r=await api('uploadEkg',{caseId,ekg:data});
    if(!r.success){ toast(r.message,'err'); return; }
    toast('EKG 已上傳，併入 '+caseId,'ok'); aiKick(caseId,(r.case.ekg||[]).length-1);
    if(pickMode==='more'){ emt.case=r.case; renderEMT(); } else poll();
  }
});
function compressImage(file,maxSide=1600,q=.78){
  return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,maxSide/Math.max(img.width,img.height)); const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg',q)); };
    img.onerror=rej; img.src=url; });
}

function aiKick(caseId,idx,force){
  if(AI_OFF || idx<0 || !caseId) return; const k=caseId+'_'+idx;
  if(aiKicked.has(k) && !force) return; aiKicked.add(k);
  api('aiRead',{caseId,idx}).then(r=>{
    if(r && r.disabled){ AI_OFF=true; return; }
    if(r && !r.success && force) toast('AI：'+(r.message||'暫時無法判讀'),'err');
    if(r && r.case){
      [cases,trackCases].forEach(arr=>{ const i=arr.findIndex(x=>x.CaseID===caseId); if(i>=0) arr[i]=Object.assign(arr[i],r.case); });
      if(emt.caseId===caseId){ emt.case=Object.assign(emt.case||{},r.case); if(page==='pageEMT') renderEMT(); }
      if(page==='pageTask') renderTask(); else if(page==='pageTrack' && trackSel===caseId) renderTrack();
    }
  });
}

      <div class="aip-main"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div><div class="aip-sub">正在分析 12 導程心電圖…約 5–20 秒</div></div></div>`; }
  if(a.error) return `<div class="aip"><div class="aip-top"><span class="aip-badge">AI ECG ANALYSIS</span></div><div class="aip-sub">AI 判讀失敗：${esc(a.error)}</div><button class="btn bgh btn-sm" style="margin-top:8px" onclick="event.stopPropagation();aiKick('${c.CaseID}',${i},true)">重試</button></div>`;

      <div class="verdict"><div class="vm v-${a.stemi}">${l}</div><div class="vs">${a.territory&&a.territory!=='無'?esc(a.territory):'部位：—'}${a.quality==='poor'?'｜<span style="color:#FFD060">影像品質不佳</span>':''}</div></div>

function runTypers(){
  tickRings();
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-type]').forEach(el=>{
    const txt=el.dataset.type, key=el.dataset.key; el.removeAttribute('data-type'); typed.add(key);
    if(reduce){ el.textContent=txt; el.classList.remove('caret'); return; }
    let n=0; const t=setInterval(()=>{ n+=2; el.textContent=txt.slice(0,n); if(n>=txt.length){ clearInterval(t); el.classList.remove('caret'); } },28);
  });

// ── 任務管線
function pipeSteps(c){
  const cl=c.calls||[], lastAi=(c.ekg||[]).filter(e=>e.ai&&!e.ai.error).pop(), aiRun=(c.ekg||[]).some(e=>e.aiRunning);
  const cathAck=['tech','nurse'].every(r=>cl.some(x=>x.role===r&&x.ackAt)) || (c.cathBy||[]).length>0;
  const cathT=(c.cathBy||[])[0]?.t || (cl.filter(x=>['tech','nurse'].includes(x.role)&&x.ackAt).map(x=>x.ackAt).sort()[0]);
  const closed=c.status==='closed', noAct=c.status==='not_activated';
  const st=(done,now,skip)=>skip?'skip':(done?'done':(now?'now':''));
  const S=[
    [c.source==='emt'?'🚑':'🚶','通報',st(true),c.reportTime],
    ['🤖',CU&&CU.role==='emt'?'品質':'AI',AI_OFF?'skip':(lastAi&&lastAi.ai.quality==='poor'?'warn':st(!!lastAi,aiRun||(!lastAi&&(c.ekg||[]).length>0))),lastAi&&lastAi.ai.t],
    ['⚡','NP',st(!!c.npTime,c.status==='pending'),c.npTime],
    ['❤️','CV',st(!!c.cvTime,c.status==='cv_reading',closed),c.cvTime],
    ['🏥','導管室',st(cathAck,c.status==='activated'&&!cathAck,closed||noAct),cathT],
    ['🏁','到院',st(!!c.arrivalTime,['cv_reading','activated'].includes(c.status)&&!c.arrivalTime&&c.source==='emt',closed||noAct),c.arrivalTime],
    ['🚪','送導管室',st(!!c.cathIn,c.status==='activated'&&!!c.arrivalTime,closed||noAct),c.cathIn]
  ];
  return S;
}
function pipelineHtml(c){
  return `<div class="pipe">${pipeSteps(c).map(([ic,l,s,t])=>`<div class="pn ${s}"><div class="pd">${s==='done'?'✓':(s==='warn'?'!':ic)}</div><div class="pl">${l}${s==='warn'?'不佳':''}</div><div class="pt">${(s==='done'||s==='warn')&&t?hm(t):''}</div></div>`).join('')}</div>`;
}
function miniPipe(c){ return `<div class="mini">${pipeSteps(c).map(x=>`<i class="${x[2]}"></i>`).join('')}</div>`; }
// ── 2 分鐘倒數環（NP 待判斷、CV 判讀中）
function ringHtml(c){
  let from=null, label='';
  if(c.status==='pending' && ['np','dr','admin'].includes(CU.role)){ from=c.reportTime; label='NP 判斷時限 2 分鐘，逾時自動打備援'; }

  return `<div class="ringwrap" data-ringwrap="${from}"><div class="ring"><svg width="58" height="58"><circle class="bgc" cx="29" cy="29" r="24"/><circle class="fg" cx="29" cy="29" r="24" stroke-dasharray="${2*Math.PI*24}" data-ring="${from}"/></svg><div class="rt" data-ringt="${from}"></div></div><div class="muted" style="color:var(--text2)">${label}</div></div>`;

function tickRings(){
  document.querySelectorAll('[data-due]').forEach(el=>{ const s=Math.round((new Date(el.dataset.due)-Date.now())/1000); el.textContent=s>=0?'下次 '+fmtSec(s):'逾時 '+fmtSec(-s); el.closest('.vsb')?.classList.toggle('late',s<0); });

    <dt>發作時間</dt><dd>${c.onset?LBL(ONSET,c.onset):'—'}</dd>
    <dt>院前處置</dt><dd>${(c.tx||[]).map(x=>`<span class="tag t-blue">${esc(x.label)} ${hm(x.t)}</span>`).join('')||'<span class="muted">無</span>'}</dd>
    ${c.bed?`<dt>床號</dt><dd>${esc(c.bed)}</dd>`:''}
    ${(c.cathBy||[]).length?`<dt>導管室接手</dt><dd>${c.cathBy.map(x=>`<span class="tag t-green">${esc(x.name)} ${hm(x.t)}</span>`).join('')}</dd>`:''}
  </dl>`;
  const ekgFold=CU.role==='ern' && withActions;
  if(ekgFold) h+=`<details class="npdone" style="margin-top:8px"><summary>EKG 與 AI 判讀（${(c.ekg||[]).length} 張）— 點開查看</summary>`;

  if(ekgFold) h+=`</details>`;
  if(withActions && ['np','dr','admin'].includes(CU.role) && ['pending','cv_reading','activated'].includes(c.status)) h+=`<div class="act"><button class="btn bgh btn-sm" onclick="pickEkg('task')">📷 補傳 EKG</button></div>`;
  h+=`</div>`;
  h+=withActions?handoffHtml(c):'';
  const cl=c.calls||[];
  h+=`<div class="card"><div class="card-title" style="margin-bottom:8px">電話通知</div>${cl.length?`<table class="calls"><tr><th>角色</th><th>對象</th><th>狀態</th><th>次數</th><th>確認</th></tr>${cl.map(x=>`<tr><td>${CALLROLE[x.role]||esc(x.role)}${x.level?'（備援）':''}</td><td>${esc(x.name)}</td><td>${x.status==='acked'?'<span class="tag t-green">已確認</span>':esc(CALLST[x.status]||x.status)}</td><td>${x.attempts}</td><td>${x.ackAt?hm(x.ackAt):'—'}</td></tr>`).join('')}</table>`:'<div class="muted">尚未撥號</div>'}</div>`;
  h+=`<div class="card"><div class="card-title" style="margin-bottom:10px">時間軸</div><div class="tl">${(c.events||[]).map(e=>`<div class="tl-i ${e.kind}"><span class="tl-t">${hm(e.t,true)}</span>${esc(e.text)} <span class="tl-w">${e.by?'— '+esc(e.by):''}</span></div>`).join('')}</div></div>`;
  return h;
}

function actionsHtml(c){
  const r=CU.role, adm=r==='admin'; let h='';
  if(c.status==='pending' && (['np','dr'].includes(r)||adm))
    h+=`<div class="act"><button class="btn br btn-lg" onclick="npSend()">送 CV 判讀</button><button class="btn bgh btn-lg" onclick="npCloseAsk()">不符合，結案</button></div>`;
  if(c.status==='cv_reading' && (['cv','dr'].includes(r)||adm))
    h+=`<div class="act"><button class="btn br btn-lg" onclick="cvActAsk()">${r==='dr'?'（備援）':''}啟動導管室</button><button class="btn bgh btn-lg" onclick="cvNoAsk()">不啟動</button></div>`;
  if(['cv_reading','activated'].includes(c.status) && !c.arrivalTime && (['np','dr','ern'].includes(r)||adm))
    h+=`<div class="row-li" style="margin-top:12px"><div class="grow"><b>病人到院</b><div class="muted">EMT 報出案件碼 → 填床號（不填姓名、病歷號）</div></div><input class="inp" id="bedIn" placeholder="床號" style="max-width:120px"><button class="btn bg" onclick="arrive()">到院</button></div>`;
  if(c.status==='activated' && (['tech','nurse'].includes(r)) && !(c.cathBy||[]).some(x=>uk(x.username)===uk(CU.username)))
    h+=`<div class="act"><button class="btn bb btn-lg" onclick="cathGo()">我接手・出發</button></div>`;
  if(c.status==='activated' && c.arrivalTime && (['np','dr','ern','tech','nurse'].includes(r)||adm))
    h+=`<div class="act"><button class="btn br" onclick="toCath()">病人送入導管室</button></div>`;
  return h;

async function loadEkgs(c){
  if(['np','dr','cv'].includes(CU.role)) (c.ekg||[]).forEach((e,i)=>{ if(!e.ai && !e.aiRunning) aiKick(c.CaseID,i); });
  for(let i=0;i<(c.ekg||[]).length;i++){
    const key=c.CaseID+'_'+i, el=document.getElementById('ekg_'+key); if(!el) continue;
    if(ekgCache[key]){ el.innerHTML=`<img src="${ekgCache[key]}" alt="EKG">`; continue; }
    if(ekgCache[key]===false) continue; ekgCache[key]=false;
    const r=await api('getEkg',{caseId:c.CaseID,idx:i});
    if(r.success){ ekgCache[key]=r.dataUrl; const e2=document.getElementById('ekg_'+key); if(e2) e2.innerHTML=`<img src="${r.dataUrl}" alt="EKG">`; }
    else { delete ekgCache[key]; el.textContent='載入失敗，稍後重試'; }
  }
}
function zoomEkg(id,i){ const u=ekgCache[id+'_'+i]; if(!u) return; modal(`<div class="zoom"><img src="${u}" alt="EKG"></div><div class="act"><button class="btn bgh" onclick="closeModal()">關閉</button></div>`,true); }

async function doAct(action,data,okMsg){
  const r=await api(action,Object.assign({caseId:selId},data));
  if(!r.success){ toast(r.message,'err'); return false; }
  toast(okMsg,'ok'); closeModal();
  const i=cases.findIndex(x=>x.CaseID===selId); if(i>=0 && r.case){ cases[i]=Object.assign(cases[i],r.case); }
  poll(); renderTask(); return true;
}

let trackDays=7, trackCases=[], trackSel=null;
async function loadTrack(){
  document.getElementById('trackBody').innerHTML='<div class="card muted">讀取中…</div>';
  const r=await api('getCases',{scope:'recent',days:trackDays});
  if(!r.success){ document.getElementById('trackBody').innerHTML=`<div class="alert al-red">${esc(r.message)}</div>`; return; }
  trackCases=r.cases; renderTrack();
}
function renderTrack(){
  const canExport=['np','dr','admin'].includes(CU.role);
  if(trackSel){ const c=trackCases.find(x=>x.CaseID===trackSel);
    if(c){ document.getElementById('trackBody').innerHTML=`<button class="btn bgh btn-sm" onclick="trackSel=null;renderTrack()">← 返回</button><div style="height:10px"></div>`+metricsHtml(c)+detailHtml(c,false); runTypers(); loadEkgs(c); return; } }
  document.getElementById('trackBody').innerHTML=`<div class="card"><div class="card-hd"><div class="card-ico" style="background:rgba(245,166,35,.15)">🗂</div><div><div class="card-title">案件追蹤</div><div class="card-sub">共 ${trackCases.length} 案</div></div></div>
    <div class="act" style="margin-top:0"><select class="inp" style="max-width:150px" onchange="trackDays=Number(this.value);loadTrack()">${[1,7,31,90].map(d=>`<option value="${d}" ${d===trackDays?'selected':''}>近 ${d} 天</option>`).join('')}</select>
    ${canExport?'<button class="btn bgh" onclick="exportCsv()">⬇ 匯出查檢表 CSV</button>':''}</div></div>`+
    (trackCases.map(c=>`<div class="case-li" onclick="trackSel='${c.CaseID}';renderTrack();window.scrollTo(0,0)"><div class="r1"><span class="cid">${esc(c.CaseID)}</span>${statusTag(c)}</div><div class="r2">${c.source==='emt'?'🚑 '+esc(c.unit):'🚶 自行來院'}｜${dt(c.reportTime)}｜${callSummary(c)}</div></div>`).join('')||'<div class="muted">此期間沒有案件</div>');
}
function metricsHtml(c){
  const cl=c.calls||[], s=(a,b)=>(a&&b)?fmtSec(Math.round((new Date(b)-new Date(a))/1000)):'—';
  const acks=['tech','nurse'].map(r=>cl.filter(x=>x.role===r&&x.ackAt).map(x=>new Date(x.ackAt).getTime())).map(a=>a.length?Math.min(...a):null);
  const allAck=acks.every(x=>x)?new Date(Math.max(...acks)).toISOString():null;
  const M=[['通報 → NP 處理',s(c.reportTime,c.npTime)],['CV 來電 → 判讀',s(c.cvCallAt,c.cvTime)],
    ['啟動 → 導管室全員確認',c.cvDecision==='activate'?s(c.cvTime,allAck):'—'],['到院 → 進導管室',s(c.arrivalTime,c.cathIn)],
    ['電話通數',cl.reduce((n,x)=>n+x.attempts,0)+' 通'],['升級備援',cl.some(x=>x.level>=1)?'是':'否']];
  return `<div class="card"><div class="card-title" style="margin-bottom:10px">本案指標</div><div class="mgrid">${M.map(([l,v])=>`<div class="metric"><div class="l">${l}</div><div class="v mono">${v}</div></div>`).join('')}</div></div>`;
}
async function exportCsv(){
  toast('匯出中…'); const r=await api('exportData',{days:Math.max(trackDays,31)});
  if(!r.success){ toast(r.message,'err'); return; }
  const csv='﻿'+[r.head,...r.rows].map(row=>row.map(v=>'"'+String(v===null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='AMI查檢表_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
}

    <div class="act"><button class="btn bgh" onclick="closeModal()">關閉</button><button class="btn br" onclick="logout()">登出</button></div>`);
}
async function saveMyPhone(){ const r=await api('setMyPhone',{phone:val('myPhone')}); toast(r.success?'已儲存':r.message,r.success?'ok':'err'); if(r.success){ CU=r.user; } }
async function changePw(){ const r=await api('changePw',{oldPassword:val('pw0'),newPassword:val('pw1')}); toast(r.message,r.success?'ok':'err'); if(r.success) closeModal(); }

// ════════════════════════════════════════
//  共用
// ════════════════════════════════════════
function uk(v){ const s=String(v==null?'':v).trim().toLowerCase(); return /^\d+$/.test(s)?(s.replace(/^0+/,'')||'0'):s; }
function val(id){ const e=document.getElementById(id); return e?e.value.trim():''; }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function statusTag(c){ const [l,cl]=STATUS[c.status]||[c.status,'t-gray']; return `<span class="tag ${cl}">${l}</span>`; }
function hm(t,sec){ if(!t) return '—'; const d=new Date(t); return d.toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit',second:sec?'2-digit':undefined}); }
function dt(t){ if(!t) return '—'; const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+hm(t); }
function fmtSec(s){ if(s===null||s===undefined||isNaN(s)) return '—'; const m=Math.floor(s/60); return m+':'+String(s%60).padStart(2,'0'); }
function since(t){ return fmtSec(Math.max(0,Math.round((Date.now()-new Date(t))/1000))); }
function modal(html,wide){ const b=document.getElementById('mbox'); b.className='mbox'+(wide?' wide':''); b.innerHTML=html; document.getElementById('ov').classList.add('on'); }
function closeModal(){ document.getElementById('ov').classList.remove('on'); }
function confirmBox(title,msg,fn){ window._cf=fn; modal(`<h3>${title}</h3>${msg?`<p class="muted" style="margin-bottom:10px">${msg}</p>`:''}<div class="act"><button class="btn bgh" onclick="closeModal()">取消</button><button class="btn br" onclick="window._cf()">確認</button></div>`); }
let _tt; function toast(m,k){ const t=document.getElementById('toast'); t.textContent=m; t.className='show '+(k||''); clearTimeout(_tt); _tt=setTimeout(()=>t.className='',2600); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });
themeApply();
setInterval(()=>{ document.querySelectorAll('[data-since]').forEach(el=>el.textContent=since(el.dataset.since)); tickRings(); },1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); });

// 啟動：有登入紀錄就直接進入
(async()=>{
  if(API.indexOf('PASTE_')===0){ toast('請先在 index.html 設定 API 網址','err'); }
  const t=lsGet('ami_token');
  if(t){
    TOKEN=t; const r=await api('me');
    if(r.success){
      CU=r.user;
      // 帳號中心使用者：中心已登出、或已換成別人 → 重新以帳號中心登入
      const cu=window.ACCOUNT && ACCOUNT.cachedUser();
      if(CU.sso && window.ACCOUNT && (!ACCOUNT.token() || (cu && uk(cu.empId)!==uk(CU.username)))){ TOKEN=null; CU=null; lsSet('ami_token',null); }
      else { startApp(); return; }
    } else { TOKEN=null; lsSet('ami_token',null); }
  }
  await trySso();
})();
</script>
